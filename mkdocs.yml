site_name: AI in Education Wiki
site_description: AI in Education 前沿进展、研究论文、产品应用、政策与伦理
site_author: OpenClaw Wiki
site_url: https://ai-edu-wiki.vercel.app

repo_name: YOUR_GITHUB_USERNAME/edu-wiki
repo_url: https://github.com/YOUR_GITHUB_USERNAME/edu-wiki

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - assets/custom.css

markdown_extensions:
  - meta
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.extra
  - pymdownx.tilde

nav:
  - 首页: index.md
  - 概念:
      - concepts/自适应学习系统.md
      - concepts/知识追踪.md
      - concepts/教学智能体.md
      - concepts/自动选择题生成.md
      - concepts/AI学术诚信与隐瞒行为.md
      - concepts/教育公平与偏见.md
      - concepts/学生主导AI政策.md
      - concepts/协作学习仿真.md
      - concepts/AI写作辅助与拥有感.md
      - concepts/社会机器人与CASA范式.md
      - concepts/个性化问题生成.md
      - concepts/学习脚手架.md
      - concepts/可解释教学编排.md
      - concepts/诊断推理与LLM智能体.md
      - concepts/个性化工作例生成.md
      - concepts/教育游戏自动生成.md
      - concepts/教学化身与教师存在感.md
      - concepts/AI辅助代码审查与自我调节学习.md
      - concepts/可解释学生行为诊断对话系统.md
      - concepts/英语口语分级生成系统.md
      - concepts/STEM论证分组系统.md
      - concepts/教育合成数据基准.md
  - 实体:
      - entities/Yiran-Du研究团队.md
      - entities/CausaDisco.md
      - entities/Edu-MMBias.md
      - entities/PAL.md
      - entities/Khan-Academy.md
      - entities/Duolingo.md
      - entities/Squirrel-AI.md
      - entities/好未来.md
      - entities/Coursera.md
      - entities/Khanmigo.md
      - entities/Duolingo-Max.md
      - entities/Squirrel-AI-产品.md
      - entities/OpenAI-Gym-Education.md
      - entities/Edmentum.md
      - entities/UNESCO-AI教育.md
      - entities/中国教育部-AI政策.md
      - entities/AIED会议.md
      - entities/CHI会议.md
      - entities/LAK会议.md
      - entities/Chris-Piech.md
      - entities/Kenneth-Koedinger.md
      - entities/Neil-Heffernan.md
      - entities/Emma-Brunskill.md
      - entities/Xiangen-Hu.md
      - entities/Stanford-HAI.md
      - entities/CMU-Learning-Science.md
      - entities/ASSISTments团队.md
  - 时间线:
      - timelines/2020.md
      - timelines/2021.md
      - timelines/2022.md
      - timelines/2023.md
      - timelines/2024.md
      - timelines/2025.md
      - timelines/2026.md
