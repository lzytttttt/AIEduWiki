plugins:
  - search:
      lang:
        - en
        - zh

docs_dir: wiki
site_dir: site

exclude_docs: |
  node_modules/
  _archive/
  raw/
  server.js
  package.json
  package-lock.json
  server.log
  prebuild.py
  .git/
